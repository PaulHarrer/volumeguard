<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volume Guard</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <button id="mute" class="speaker" type="button" aria-label="Mute">
          <svg id="speaker-on" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 9v6h3.2L12 19.8V4.2L7.2 9H4zm11.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zm2.5 0c0 2.9-1.6 5.4-4 6.7v2.1c3.4-1.4 5.8-4.8 5.8-8.8S17.4 5.6 14 4.2v2.1c2.4 1.3 4 3.8 4 6.7z"
            />
          </svg>
          <svg id="speaker-off" class="hidden" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M4 9v6h3.2L12 19.8V4.2L7.2 9H4zm11.5 3c0-1.8-1-3.3-2.5-4v8c1.5-.7 2.5-2.2 2.5-4zM16.3 8.1l-1.4 1.4 4.5 4.5 1.4-1.4-4.5-4.5zm4.5-1.4-1.4-1.4-8.1 8.1 1.4 1.4 8.1-8.1z"
            />
          </svg>
        </button>
        <div class="level">
          <span id="percent">100</span>
          <span class="unit">%</span>
        </div>
      </header>

      <label class="slider-wrap">
        <span class="sr-only">Volume</span>
        <input id="slider" type="range" min="0" max="600" step="1" value="100" />
        <span class="marks">
          <span>0</span>
          <span class="mark-100">100</span>
          <span>600</span>
        </span>
      </label>

      <div class="presets" role="group" aria-label="Presets">
        <button type="button" data-volume="0">Mute</button>
        <button type="button" data-volume="100">100%</button>
        <button type="button" data-volume="200">200%</button>
        <button type="button" data-volume="300">300%</button>
        <button type="button" data-volume="600">600%</button>
      </div>

      <p id="error" class="error hidden"></p>

      <section class="tabs-section">
        <h1>Playing</h1>
        <ul id="tabs"></ul>
        <p id="empty" class="empty">No tabs are playing audio</p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

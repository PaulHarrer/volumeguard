<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Volume Guard</title>
  </head>
  <body class="w-80 max-w-80 overflow-x-hidden bg-bg font-sans text-[13px] leading-snug text-ink antialiased select-none">
    <main class="p-4">
      <header class="flex items-center gap-3">
        <div
          id="tab-mark"
          class="grid size-9 shrink-0 place-items-center overflow-hidden rounded-xl bg-surface text-[11px] font-semibold text-muted"
        ></div>
        <div class="min-w-0 flex-1">
          <p id="tab-title" class="truncate text-sm font-semibold leading-5">This tab</p>
          <p id="tab-host" class="truncate text-xs leading-4 text-muted"></p>
        </div>
        <button
          id="mute"
          type="button"
          class="grid size-10 shrink-0 cursor-pointer place-items-center rounded-xl bg-surface text-accent transition-colors hover:bg-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
          aria-label="Mute"
        >
          <svg id="speaker-on" class="size-5" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
            />
          </svg>
          <svg id="speaker-off" class="hidden size-5" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"
            />
          </svg>
        </button>
      </header>

      <div id="level" class="mt-4 flex items-baseline gap-0.5">
        <span id="percent" class="text-[40px] font-semibold leading-none tracking-tight text-ink tabular-nums">100</span>
        <span class="text-base font-semibold text-muted">%</span>
      </div>

      <label class="mt-3 block">
        <span class="sr-only">Volume</span>
        <input
          id="slider"
          class="vg-range"
          type="range"
          min="0"
          max="600"
          step="1"
          value="100"
          title="Double-click to reset to 100%"
        />
        <span class="relative mt-1.5 block h-4 text-[11px] text-muted tabular-nums">
          <span class="absolute left-0">0</span>
          <span class="mark-100 absolute -translate-x-1/2">100</span>
          <span class="absolute right-0">600</span>
        </span>
      </label>

      <div class="mt-3 grid grid-cols-4 gap-1.5" role="group" aria-label="Presets">
        <button type="button" data-volume="100" aria-pressed="false" class="inline-flex h-8 min-w-0 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface text-xs font-semibold text-ink transition-colors hover:border-accent/40 aria-pressed:border-accent aria-pressed:bg-accent/10 aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">100%</button>
        <button type="button" data-volume="200" aria-pressed="false" class="inline-flex h-8 min-w-0 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface text-xs font-semibold text-ink transition-colors hover:border-accent/40 aria-pressed:border-accent aria-pressed:bg-accent/10 aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">200%</button>
        <button type="button" data-volume="300" aria-pressed="false" class="inline-flex h-8 min-w-0 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface text-xs font-semibold text-ink transition-colors hover:border-accent/40 aria-pressed:border-accent aria-pressed:bg-accent/10 aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">300%</button>
        <button type="button" data-volume="600" aria-pressed="false" class="inline-flex h-8 min-w-0 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface text-xs font-semibold text-ink transition-colors hover:border-accent/40 aria-pressed:border-accent aria-pressed:bg-accent/10 aria-pressed:text-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent">600%</button>
      </div>

      <div id="site-save" class="mt-2.5 hidden items-center gap-1.5">
        <button
          id="save-site"
          type="button"
          aria-pressed="false"
          class="inline-flex h-8 min-w-0 flex-1 cursor-pointer items-center justify-center gap-1.5 rounded-lg border border-line bg-surface px-2.5 text-xs font-medium text-ink transition-colors hover:border-accent/40 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent disabled:cursor-default"
        >
          <svg id="save-icon-outline" class="size-3.5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15-5-2.18L7 18V5h10v13z"
            />
          </svg>
          <svg id="save-icon-filled" class="hidden size-3.5 shrink-0" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2z" />
          </svg>
          <span id="save-site-label" class="truncate">Save for this site</span>
        </button>
        <button
          id="remove-site"
          type="button"
          class="hidden h-8 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-line bg-surface px-2.5 text-xs font-medium text-muted transition-colors hover:border-hot/40 hover:text-hot focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
        >
          Remove
        </button>
      </div>

      <p id="error" class="mt-3 hidden text-xs leading-4 text-hot" role="alert"></p>

      <section id="others" class="mt-4 hidden border-t border-line pt-3">
        <h2 class="mb-1.5 text-[11px] font-semibold tracking-[0.06em] text-muted uppercase">Other tabs</h2>
        <ul id="tabs" class="grid max-h-40 gap-0.5 overflow-y-auto"></ul>
      </section>

      <section id="saved-section" class="mt-4 hidden border-t border-line pt-3">
        <div class="mb-1.5 flex items-center justify-between">
          <h2 class="text-[11px] font-semibold tracking-[0.06em] text-muted uppercase">Saved sites</h2>
          <span id="saved-count" class="text-[11px] font-medium text-muted tabular-nums"></span>
        </div>
        <ul id="saved-list" class="grid max-h-36 gap-0.5 overflow-y-auto"></ul>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
